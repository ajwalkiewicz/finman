<!DOCTYPE html>
<html>
  <head>
    <title>CSV Parser Test</title>
  </head>
  <body>
    <h1>CSV Parser Test</h1>
    <textarea
      id="csvInput"
      rows="20"
      cols="100"
      placeholder="Paste your CSV data here..."
    ></textarea>
    <br /><br />
    <button onclick="testParse()">Test Parse</button>
    <br /><br />
    <div id="results"></div>

    <script>
      // Copy the exact parseCSVLine function from Vue component
      const parseCSVLine = (line) => {
        const result = [];
        let current = "";
        let inQuotes = false;

        for (let i = 0; i < line.length; i++) {
          const char = line[i];

          if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === "," && !inQuotes) {
            result.push(current.trim());
            current = "";
          } else {
            current += char;
          }
        }

        result.push(current.trim());
        return result;
      };

      // Copy the exact parseCSV function from Vue component
      const parseCSV = (csvText) => {
        const lines = csvText.split("\n").filter((line) => line.trim());
        if (lines.length < 2) return [];

        const headers = parseCSVLine(lines[0]).map((h) => h.replace(/"/g, ""));
        const expectedHeaders = [
          "title",
          "origin_account",
          "destination_account",
          "amount",
          "currency",
          "day_of_month",
          "description",
        ];

        // Check if headers match expected format
        const hasValidHeaders = expectedHeaders.every((header) =>
          headers.some((h) => h.toLowerCase() === header.toLowerCase())
        );

        if (!hasValidHeaders) {
          throw new Error(
            `Invalid CSV format. Expected headers: ${expectedHeaders.join(
              ", "
            )}`
          );
        }

        const data = [];
        for (let i = 1; i < lines.length; i++) {
          const values = parseCSVLine(lines[i]).map((v) => v.replace(/"/g, ""));
          if (values.length >= headers.length) {
            const row = {};
            headers.forEach((header, index) => {
              const normalizedHeader = header.toLowerCase();
              if (
                expectedHeaders.includes(normalizedHeader) &&
                index < values.length
              ) {
                row[normalizedHeader] = values[index];
              }
            });

            // Only add row if it has the required fields
            if (row.title && row.amount && row.currency && row.day_of_month) {
              data.push(row);
            }
          }
        }

        return data;
      };

      function testParse() {
        const csvText = document.getElementById("csvInput").value;
        const resultsDiv = document.getElementById("results");

        try {
          const parsed = parseCSV(csvText);
          resultsDiv.innerHTML = `
                    <h2>Parsing Results</h2>
                    <p><strong>Total rows parsed:</strong> ${parsed.length}</p>
                    <h3>Parsed Data:</h3>
                    <pre>${JSON.stringify(parsed, null, 2)}</pre>
                `;
        } catch (error) {
          resultsDiv.innerHTML = `
                    <h2>Error</h2>
                    <p style="color: red;">${error.message}</p>
                `;
        }
      }

      // Auto-load the CSV data for testing
      window.onload = function () {
        const csvData = `title,origin_account,destination_account,amount,currency,day_of_month,description

Loan,Santander,Expense,3800,PLN,15,Loan Payment`;

        document.getElementById("csvInput").value = csvData;
        testParse();
      };
    </script>
